[project]
name = "frameforge-mcp"
# The PACKAGE version, on its own release line — not the document contract
# version (`frameforge_api.HEAD_VERSION`) and not the engine's. 1.0.0 was the
# monorepo's MCP server, extracted unchanged.
#
# 2.0.0 because ONE behaviour changed incompatibly: file inputs to the propose /
# measure / font-closure tools are now confined to the session root, working
# directory, and repository unless FRAMEFORGE_MCP_INPUT_ROOTS says otherwise.
# A deployment that read images from elsewhere must now declare where. No tool
# was renamed or removed and no argument changed; see MIGRATION.md.
version = "2.0.0"
description = "The FrameForge MCP server — agent-facing author→render→verify loop, raster→vector reconstruction, and the construction coach"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pedro Anisio Silva", email = "pedroanisio@gmail.com" }]
keywords = ["frameforge", "mcp", "model-context-protocol", "agent", "computer-vision", "document-composition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# This is the top of the stack: it authors with the SDK, renders with the
# engine, and verifies against the result. Unlike frameforge-api and
# frameforge-sdk it is NOT a leaf and does not pretend to be one.
dependencies = [
    # Bounded like every other family edge. This was the one runtime dependency
    # with no constraint at all, so a published frameforge-mcp would have
    # accepted a future major of the engine without review.
    "frameforge>=2.9,<3",      # the engine: render, conform, the validator
    "frameforge-api>=1.2,<2",   # the contract, imported directly by the deprecation tools
    # Floor is 1.1, not 1.0: the SDK 1.1.0 release is what added
    # `explain_validation_error` and `fieldsets`, and the MCP error surface
    # reports authoring sites through them.
    "frameforge-sdk[metrics]>=1.1,<2",  # authoring + portable closure metrics
    "mcp[cli]>=1.27,<2",
    "pydantic>=2",
    "pyyaml>=6",
    "cairosvg>=2.7",           # browser-free PNG raster, so a VLM can see a render
]

[project.optional-dependencies]
# Every extra here names the DISTRIBUTION *and the extra of it* that carries the
# backend its lane imports. Naming `frameforge-vision` bare installs the package
# whose imports are all lazy — so the lane resolves, installs clean, and then
# answers every call with `No module named 'cv2'`. An extra that does not
# install what its tools import is a broken lane, not a lighter one.
#
# The raster→vector reconstruction lane. Its own distribution
# (`frameforge-vision`), not a package shipped here — it is usable without an
# MCP server or an authoring SDK, and duplicating the module name would give
# `frameforge_vision` two homes. `[cv]` is where OpenCV + Pillow live.
vision = ["frameforge-vision[cv]>=1.0,<2"]
# Local vision-language describer (the `describe_render` tool). CPU-runnable;
# kept separate from `vision` because torch is heavy. Delegated to the vision
# distribution's own `vlm` extra rather than re-pinning torch/transformers here:
# `describe_render` calls `frameforge_vision.vlm`, so that package owns the pins.
# Floor is 1.1, not 1.0: the `vlm` extra of frameforge-vision 1.0.0 did not
# carry torchvision, which transformers 5.x needs for the image processor of the
# default model — so `>=1.0` would resolve to a release whose lane cannot run.
vlm = ["frameforge-vision[vlm]>=1.1,<2"]
# PDF input for propose_from_document — which reaches PyMuPDF *through*
# frameforge_vision's pdf_source and then runs the CV detectors over the
# rasterised page, so the lane needs both.
pdf = ["frameforge-vision[cv]>=1.0,<2", "pymupdf>=1.24"]
# PDF *output* (`to='pdf'` on the render tools, and the
# frameforge://session/<id>/document.pdf resource): CairoSVG lowers each page and
# pypdf concatenates them. CairoSVG is a base dependency; pypdf was declared
# nowhere, so the advertised PDF lane could not be installed at all.
pdfout = ["pypdf>=4"]
# Headless Chromium raster, when the browser path is preferred over CairoSVG.
# Needs `playwright install chromium` after the extra: a browser binary is not
# a Python dependency and no resolver can fetch it for you.
browser = ["playwright>=1.44"]

[project.scripts]
frameforge-mcp = "frameforge_mcp.__main__:main"
frameforge-live = "frameforge_mcp.live.__main__:main"

[project.urls]
Repository = "https://github.com/pedroanisio/frameforge-mcp"
Issues = "https://github.com/pedroanisio/frameforge-mcp/issues"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

# The family is published on GitHub, not on a package index. DEV-ONLY: uv drops
# `tool.uv.sources` when building the wheel, so the published artifact declares
# plain requirements.
#
# Two rules, both learned from a resolution that actually failed:
#
#  1. Intra-family sources are git URLs, NEVER relative paths. uv reads this
#     table when another project resolves THIS one from git, and rewrites
#     `path = "../x"` into `git+<this repo>#subdirectory=../x`, which cannot
#     exist. One `path` entry here made a clean clone of the ENGINE unresolvable.
#
#  2. There is NO entry for `frameforge`. The engine's own dev group depends on
#     this package, so in that resolution `frameforge` is the root project — a
#     path (editable) source by construction. Any URL declared for it here is a
#     second, conflicting URL for the same package and uv rejects the graph
#     ("Requirements contain conflicting URLs for package `frameforge`"). The
#     requirement in [project.dependencies] stays; only the source is absent, and
#     the consuming resolution supplies the engine.
#
# Consequence, stated plainly: `uv lock` in a standalone clone of THIS repo
# cannot resolve `frameforge>=2.9` — nothing in the family is on an index, and
# PyPI's `frameforge` is an unrelated 0.0.1 stub. Publishing the family (or
# pointing this block at a private index) is what closes it. Until then, develop
# this repo from the engine's checkout, where `uv sync` installs it as the root.
[tool.uv.sources]
frameforge-api = { git = "https://github.com/pedroanisio/frameforge-api" }
frameforge-vision = { git = "https://github.com/pedroanisio/frameforge-vision" }
frameforge-sdk = { git = "https://github.com/pedroanisio/frameforge-sdk" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Two packages, one distribution — deliberately.
#
#   frameforge_mcp     the server, its tool layer, and (nested) the live web UI
#   frameforge_coach   the Vector Construction Coach
#
# `live` is nested INSIDE frameforge_mcp because it imports the MCP server
# directly and is a UI over it. `coach` is NOT nested: it does not import the
# MCP, and 6 tests + 10 examples reach it directly. Nesting it would assert a
# dependency on the server that does not exist.
[tool.hatch.build.targets.wheel]
packages = ["src/frameforge_mcp", "src/frameforge_coach"]

[tool.hatch.build.targets.sdist]
exclude = ["/.venv", "/dist", "/htmlcov", "/.pytest_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# src/ is VENDORED: extracted verbatim from the frameforge monorepo by
# `tooling/extract_mcp.py`. Restyling here would break that identity and turn
# the next re-extraction into a merge. Lint upstream.
extend-exclude = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
